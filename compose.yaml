name: person-knowledge-system

services:
  gel:
    image: geldata/gel:7.1
    environment:
      GEL_SERVER_PASSWORD: ${GEL_SERVER_PASSWORD:-local-only-change-me}
    ports:
      - "5656:5656"
    volumes:
      - gel-data:/var/lib/gel/data
      - ./GEL:/workspace/gel

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PKS_ENVIRONMENT: ${PKS_ENVIRONMENT:-local}
      PKS_GEL_DSN: ${PKS_GEL_DSN:-gel://gel:5656/knowledge}
      # TP-02 currently provides an in-process adapter; use a shared queue in a later task.
      PKS_QUEUE_BACKEND: ${PKS_QUEUE_BACKEND:-memory}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - gel

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      PKS_GEL_DSN: ${PKS_GEL_DSN:-gel://gel:5656/knowledge}
    depends_on:
      - gel

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/v1
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace
      - web-node-modules:/workspace/node_modules
    depends_on:
      - api

volumes:
  gel-data:
  web-node-modules:
