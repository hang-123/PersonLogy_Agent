name: person-knowledge-system

services:
  gel:
    image: geldata/gel:7.1
    environment:
      GEL_SERVER_PASSWORD: ${GEL_SERVER_PASSWORD:-local-only-change-me}
      # 启用 Gel UI（浏览器图形界面：schema 视图 + 数据表 + 查询 REPL）。
      # 注意：Docker 镜像环境变量带 GEL_SERVER_ 前缀（文档省略前缀写作 SERVER_ADMIN_UI）
      GEL_SERVER_ADMIN_UI: enabled
    ports:
      - "5656:5656"
    volumes:
      - gel-data:/var/lib/gel/data
      - ./GEL:/workspace/gel

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PKS_ENVIRONMENT: ${PKS_ENVIRONMENT:-local}
      PKS_GEL_DSN: ${PKS_GEL_DSN:-}
      PKS_STORAGE_BACKEND: ${PKS_STORAGE_BACKEND:-sqlite}
      PKS_SQLITE_PATH: ${PKS_SQLITE_PATH:-/workspace/data/personlogy.sqlite3}
      PKS_PDF_STORAGE_ROOT: ${PKS_PDF_STORAGE_ROOT:-/workspace/data/files}
      PKS_PDF_MAX_SIZE_BYTES: ${PKS_PDF_MAX_SIZE_BYTES:-26214400}
      PKS_QUEUE_BACKEND: ${PKS_QUEUE_BACKEND:-sqlite}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/workspace/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      PKS_STORAGE_BACKEND: ${PKS_STORAGE_BACKEND:-sqlite}
      PKS_SQLITE_PATH: ${PKS_SQLITE_PATH:-/workspace/data/personlogy.sqlite3}
      PKS_PDF_STORAGE_ROOT: ${PKS_PDF_STORAGE_ROOT:-/workspace/data/files}
      PKS_PDF_MAX_SIZE_BYTES: ${PKS_PDF_MAX_SIZE_BYTES:-26214400}
      PKS_QUEUE_BACKEND: ${PKS_QUEUE_BACKEND:-sqlite}
      # 切换到 Gel 后端时设置（worker 与 api 需一致）：
      PKS_GEL_DSN: ${PKS_GEL_DSN:-}
    volumes:
      - ./data:/workspace/data

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000/v1
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace
      - web-node-modules:/workspace/node_modules
    depends_on:
      - api

volumes:
  gel-data:
  web-node-modules:
