name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/personlogy-hook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8.4,<9"
      - run: python -m pytest tests

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../../packages/personlogy_core
      - run: pip install -e ".[dev]"
      - run: pip install -e ../../apps/worker
      - run: python -c "from app.main import create_app; create_app()"
      - run: python -c "from personlogy_worker.main import run_worker; print('worker import ok')"
        working-directory: apps/worker
      - run: ruff check app tests ../../packages/personlogy_core/src ../worker/src --config pyproject.toml
      - run: mypy app ../../packages/personlogy_core/src ../worker/src
      - run: pytest --cov=app --cov-report=term-missing
      - run: python tests/live_development_smoke.py
        working-directory: .

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personlogy-optimization-api -f apps/api/Dockerfile .
      - run: docker build -t personlogy-optimization-worker -f apps/worker/Dockerfile .
      - run: python3 tests/container_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
