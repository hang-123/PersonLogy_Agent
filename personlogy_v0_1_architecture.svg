<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8996b7" flood-opacity=".2"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#526aa8"/></marker>
    <style>
      .title{font:700 32px 'Microsoft YaHei',Arial,sans-serif;fill:#26324a}
      .subtitle{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#66738d}
      .layer{font:700 22px 'Microsoft YaHei',Arial,sans-serif;fill:#26324a}
      .group{font:700 18px 'Microsoft YaHei',Arial,sans-serif;fill:#3a4660}
      .label{font:600 16px 'Microsoft YaHei',Arial,sans-serif;fill:#28344c}
      .small{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#53607a}
      .box{fill:#fff;stroke-width:3;rx:16;filter:url(#shadow)}
      .inner{fill:#fff;stroke-width:2.3;rx:11}
      .line{stroke:#526aa8;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .dline{stroke:#8a77c5;stroke-width:2.2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#fbfcff"/>
